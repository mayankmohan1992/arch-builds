name: build-packages

# Builds packages on an Arch container, signs them, and publishes them to the
# "mayank-v4" release which pacman consumes.
#
# Three jobs:
#   plan     decides what actually needs a build (state.json vs upstream)
#   build    a matrix, one container per package, uploads package bytes only
#   publish  one writer: regenerates the pacman db + state.json
#
# The matrix is why nodejs can no longer eat the whole 6 h job budget, and why
# one broken recipe cannot stop the other 40 packages from publishing.
#
# Free-tier constraints respected here:
#   * public repo  -> standard runners are free and unlimited
#   * releases      -> free for public repos; no total size/bandwidth limit
#   * artifacts    -> NOT used (free plan caps them at 500 MB)
#   * runner       -> 4 vCPU / 16 GB RAM / 14 GB SSD, 6 h job cap
#   * no schedule: -> GitHub disables scheduled workflows in public repos after
#                     60 days of inactivity; a local timer dispatches instead.

on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: "Optional space-separated package names/specs (blank = packages.txt)"
        required: false
        default: ""
      force:
        description: "Rebuild even if already published (bumps pkgrel)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "pkgs/**"
      - "scripts/**"
      - "packages.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: repo-publish
  cancel-in-progress: false

env:
  REPO_NAME: mayank-v4
  GH_REPO: ${{ github.repository }}

jobs:
  plan:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          REQUESTED: ${{ inputs.pkgs }}
        run: |
          pacman -Syu --noconfirm --needed curl python github-cli >/dev/null
          mkdir -p repo
          gh release download "$REPO_NAME" --repo "$GH_REPO" --dir repo \
            --pattern state.json --skip-existing || true
          read -r -a req <<<"$REQUESTED" || true
          ./scripts/plan.sh "${req[@]}"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        pkg: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare builder
        run: |
          pacman -Syu --noconfirm --needed git github-cli gnupg sudo curl python binutils >/dev/null
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Rust ignores CFLAGS, so RUSTFLAGS is what actually applies the
          # target CPU to cargo builds. makepkg sources the *builder's*
          # ~/.makepkg.conf last, which is why setting RUSTFLAGS in the
          # environment had no effect: without this file every Rust package
          # (starship, tldr, usage, semver, librsvg, the artcraft apps) was
          # built for baseline x86-64.
          #
          # znver4 explicitly, never `native`: the runner is Zen 3 / Intel and
          # must not decide the instruction set for this machine.
          cat >/home/builder/.makepkg.conf <<'EOF'
          RUSTFLAGS="-C force-frame-pointers=yes -C target-cpu=znver4"
          CARGO_BUILD_JOBS="$(nproc)"
          EOF
          chown builder:builder /home/builder/.makepkg.conf
          # Keep every stock Arch setting and override only the target CPU, so
          # hardening flags and defaults stay identical to the official build.
          # Notes on the flag choice for Zen 4 (Ryzen 5 7600):
          #   -march=znver4    enables AVX-512F/BW/DQ/VL, VBMI2, VNNI, BF16, VAES,
          #                    GFNI, SHA-NI, BMI2 - every feature this CPU reports
          #   -mtune=znver4    implies 256-bit vector preference (GCC's tuning
          #                    choice for Zen 4), which avoids AVX-512 downclocking
          #   -falign-functions=32  matches Zen 4's 32-byte fetch/decode window
          #   LTO stays on (OPTIONS=lto + LTOFLAGS below)
          # Frame pointers are kept: -fomit-frame-pointer would gain ~1-2% but
          # makes crash/backtrace analysis worse.
          sed -z -i \
            's/CFLAGS="[^"]*"/CFLAGS="-march=znver4 -mtune=znver4 -O3 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -falign-functions=32"/' \
            /etc/makepkg.conf
          sed -z -i \
            's/CXXFLAGS="[^"]*"/CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"/' \
            /etc/makepkg.conf
          sed -z -i \
            's/LTOFLAGS="[^"]*"/LTOFLAGS="-flto=auto -falign-functions=32"/' \
            /etc/makepkg.conf
          # Separate -debug packages double CI time and repository size and are
          # never useful here.
          sed -i 's/ debug / !debug /' /etc/makepkg.conf
          grep -m3 -E '^(CFLAGS|CXXFLAGS|LTOFLAGS)=' /etc/makepkg.conf
          # Hard gate: if the flags below ever stop landing, the run fails here
          # instead of silently publishing baseline x86-64 binaries.
          grep -q -- '-march=znver4' /etc/makepkg.conf
          grep -q -- 'target-cpu=znver4' /home/builder/.makepkg.conf
          echo "verified: znver4 present in both makepkg.conf and ~/.makepkg.conf"

      - name: Import signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          install -d -o builder -g builder -m 700 /home/builder/.gnupg
          printf '%s\n' "$PKG_SIGNING_KEY" >/tmp/key.asc
          chown builder /tmp/key.asc
          runuser -u builder -- gpg --batch --import /tmp/key.asc
          rm -f /tmp/key.asc
          # Arch's own packager keyring, so upstream source signatures verify
          # offline. Importing keys per-recipe from HKP keyservers is flaky
          # (libpng, fontconfig, libchewing and libcloudproviders all failed
          # that way), and gpg verify only needs the public key present.
          if [[ -f /usr/share/pacman/keyrings/archlinux.gpg ]]; then
            runuser -u builder -- gpg --batch --import /usr/share/pacman/keyrings/archlinux.gpg
          fi
          runuser -u builder -- gpg --list-secret-keys --with-colons >/tmp/keys.txt
          KEYID=$(awk -F: '/^fpr:/{print $10; exit}' /tmp/keys.txt)
          test -n "$KEYID"
          echo "KEYID=$KEYID" >>"$GITHUB_ENV"
          echo "signing with $KEYID"

      - name: Rust nightly for gupax
        if: matrix.pkg == 'local:gupax'
        run: |
          # gupax needs nightly (#![feature(path_is_empty)]) and pins its own
          # toolchain in rust-toolchain.toml. Install one minimal nightly; the
          # recipe sets RUSTUP_TOOLCHAIN so rustup does not try to fetch the
          # project's full component list (rustc-dev, codegen-cranelift, ...).
          #
          # Arch's rustup package does not create ~/.cargo/bin shims, so the
          # toolchain binaries are linked into /usr/local/bin instead of relying
          # on `rustup default` to provide a proxy.
          pacman -S --noconfirm --needed rustup >/dev/null
          runuser -u builder -- rustup toolchain install nightly-2025-11-12 --profile minimal
          tc_bin=$(ls -d /home/builder/.rustup/toolchains/nightly-2025-11-12-*/bin | head -1)
          test -n "$tc_bin"
          for b in cargo rustc rustdoc; do ln -sf "$tc_bin/$b" "/usr/local/bin/$b"; done
          cargo --version
          rustc --version
          # Prove the toolchain can actually compile and link (sysroot intact).
          printf 'fn main(){}\n' >/tmp/t.rs
          rustc /tmp/t.rs -o /tmp/t && /tmp/t && echo "nightly toolchain usable"

      - name: Build ${{ matrix.pkg }}
        env:
          GH_TOKEN: ${{ github.token }}
          PKGS: ${{ matrix.pkg }}
          FORCE: ${{ inputs.force }}
          PUBLISH_DB: "0"
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # ~/.cargo/bin first so a rustup-managed toolchain (gupax) wins over
          # the distro cargo; a missing dir on the PATH is harmless.
          runuser -u builder -- bash -c \
            'export PATH=/home/builder/.cargo/bin:$PATH; cd "$GITHUB_WORKSPACE" && ./scripts/ci-build.sh'

  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.any == 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - name: Prepare publisher
        run: |
          pacman -Syu --noconfirm --needed git github-cli gnupg sudo curl python >/dev/null
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          install -d -o builder -g builder -m 700 /home/builder/.gnupg
          printf '%s\n' "$PKG_SIGNING_KEY" >/tmp/key.asc
          chown builder /tmp/key.asc
          runuser -u builder -- gpg --batch --import /tmp/key.asc
          rm -f /tmp/key.asc
          runuser -u builder -- gpg --list-secret-keys --with-colons >/tmp/keys.txt
          KEYID=$(awk -F: '/^fpr:/{print $10; exit}' /tmp/keys.txt)
          test -n "$KEYID"
          echo "KEYID=$KEYID" >>"$GITHUB_ENV"

      - name: Publish database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runuser -u builder -- bash -c 'cd "$GITHUB_WORKSPACE" && ./scripts/publish-db.sh'
