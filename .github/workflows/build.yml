name: build-packages

# Builds packages on an Arch container, signs them, and publishes them to the
# "mayank-v4" release which pacman consumes.
#
# Free-tier constraints respected here:
#   * public repo  -> standard runners are free and unlimited
#   * releases     -> free for public repos; no total size/bandwidth limit
#   * artifacts    -> NOT used (free plan caps them at 500 MB)
#   * runner       -> 4 vCPU / 16 GB RAM / 14 GB SSD, 6 h job cap
#   * no schedule: -> GitHub disables scheduled workflows in public repos after
#                     60 days of inactivity; a local timer dispatches instead.

on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: "Optional space-separated package override (blank = packages.txt)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "pkgs/**"
      - "scripts/ci-build.sh"
      - "packages.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: repo-publish
  cancel-in-progress: false

env:
  REPO_NAME: mayank-v4
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Prepare builder
        run: |
          pacman -Syu --noconfirm --needed git github-cli gnupg sudo curl python
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Keep every stock Arch setting and override only the target CPU, so
          # hardening flags and defaults stay identical to the official build.
          # Notes on the flag choice for Zen 4 (Ryzen 5 7600):
          #   -march=znver4    enables AVX-512F/BW/DQ/VL, VBMI2, VNNI, BF16, VAES,
          #                    GFNI, SHA-NI, BMI2 - every feature this CPU reports
          #   -mtune=znver4    implies 256-bit vector preference (GCC's tuning
          #                    choice for Zen 4), which avoids AVX-512 downclocking
          #   -falign-functions=32  matches Zen 4's 32-byte fetch/decode window
          #   LTO stays on (OPTIONS=lto + LTOFLAGS below)
          # Frame pointers are kept: -fomit-frame-pointer would gain ~1-2% but
          # makes crash/backtrace analysis worse.
          sed -z -i \
            's/CFLAGS="[^"]*"/CFLAGS="-march=znver4 -mtune=znver4 -O3 -pipe -fno-plt -fexceptions -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security -fstack-clash-protection -fcf-protection -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer -falign-functions=32"/' \
            /etc/makepkg.conf
          sed -z -i \
            's/CXXFLAGS="[^"]*"/CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"/' \
            /etc/makepkg.conf
          sed -z -i \
            's/LTOFLAGS="[^"]*"/LTOFLAGS="-flto=auto -falign-functions=32"/' \
            /etc/makepkg.conf
          # Separate -debug packages double CI time and repository size and are
          # never useful here.
          sed -i 's/ debug / !debug /' /etc/makepkg.conf
          grep -m3 -E '^(CFLAGS|CXXFLAGS|LTOFLAGS)=' /etc/makepkg.conf

      - name: Import signing key
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          install -d -o builder -g builder -m 700 /home/builder/.gnupg
          printf '%s\n' "$PKG_SIGNING_KEY" >/tmp/key.asc
          chown builder /tmp/key.asc
          runuser -u builder -- gpg --batch --import /tmp/key.asc
          rm -f /tmp/key.asc
          # Arch's own packager keyring, so upstream source signatures verify
          # offline. Importing keys per-recipe from HKP keyservers is flaky
          # (libpng, fontconfig, libchewing and libcloudproviders all failed
          # that way), and gpg verify only needs the public key present.
          if [[ -f /usr/share/pacman/keyrings/archlinux.gpg ]]; then
            runuser -u builder -- gpg --batch --import /usr/share/pacman/keyrings/archlinux.gpg
          fi
          runuser -u builder -- gpg --list-secret-keys --with-colons >/tmp/keys.txt
          KEYID=$(awk -F: '/^fpr:/{print $10; exit}' /tmp/keys.txt)
          test -n "$KEYID"
          echo "KEYID=$KEYID" >>"$GITHUB_ENV"
          echo "signing with $KEYID"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PKGS: ${{ inputs.pkgs }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd "$GITHUB_WORKSPACE" && ./scripts/ci-build.sh'
